<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="Laysi One">
<!--
  Laysi One — 分頁與應用程式圖示。授權 / Licence: Business Source License 1.1
  （見 repo 根目錄 LICENSE-BSL.txt）。移除、改寫或以其他標記替換，違反授權條款。

  一個圓，被一道 S 分成左右兩塊等面積：一筆分錄的借方與貸方，合起來是一個整體。
  兩塊互為 180 度旋轉，形狀完全相同。

  金取 f0b429 而不是畫面上的 accent b68235：色相幾乎沒動（36 度到 42 度），
  但彩度由 55% 拉到 87%、明度由 46% 到 55%。b68435 那一階彩度太低，貼著藍
  會被同時對比推成褐色，兩塊濁色相鄰就是一團泥。畫面上它躺在紙色底上沒有這個
  問題，所以圖示與畫面用的是同一個色相的兩階，不是兩個顏色。

  兩塊在兩種分頁列上互相接手：白底由深藍撐（11.5:1，金只有 1.9:1），
  深色分頁列由金撐（8.6:1，深藍只有 1.8:1），而兩塊之間是 4.8:1，
  所以那道 S 在哪一邊都切得開。
-->
<title>Laysi One</title>
<path fill="#234b7d" d="M50 15A35 35 0 0 0 50 85A17.5 17.5 0 0 1 50 50A17.5 17.5 0 0 0 50 15Z"/>
<path fill="#f0b429" d="M50 15A35 35 0 0 1 50 85A17.5 17.5 0 0 1 50 50A17.5 17.5 0 0 0 50 15Z"/>
</svg>
