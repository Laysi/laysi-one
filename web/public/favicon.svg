<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="Laysi One">
<!--
  Laysi One — 分頁與應用程式圖示。專有素材，著作權人所有（見 repo 根目錄
  LICENSE.txt）。移除、改寫或以其他標記替換，違反授權合約。

  兩道等長的粗弧繞成一個環，互為 180 度旋轉，中間留兩道缺口：一筆分錄的借方與
  貸方等量，而兩邊不相接。終端切平（butt），但不沿
  半徑切，內緣比外緣退後 16 度，兩道缺口因此是同向的斜槽而不是兩條輻線。

  金取 f0b429 而不是畫面上的 accent b68235：色相幾乎沒動（36 度到 42 度），
  但彩度由 55% 拉到 87%、明度由 46% 到 55%。b68235 那一階彩度太低，貼著藍
  會被同時對比推成褐色，兩塊濁色相鄰就是一團泥。畫面上它躺在紙色底上沒有這個
  問題，所以圖示與畫面用的是同一個色相的兩階，不是兩個顏色。

  兩塊在兩種分頁列上互相接手：白底由深藍撐（11.5:1，金只有 1.9:1），
  深色分頁列由金撐（8.6:1，深藍只有 1.8:1），而兩塊之間是 4.8:1，
  所以缺口在哪一邊都切得開。
-->
<title>Laysi One</title>
<path fill="#234b7d" d="M42.36 93.33A44 44 0 0 1 38.61 7.50L37.12 28.57A25 25 0 0 0 52.61 74.86Z"/>
<path fill="#f0b429" d="M57.64 6.67A44 44 0 0 1 61.39 92.50L62.88 71.43A25 25 0 0 0 47.39 25.14Z"/>
</svg>
