<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Noto Sans TC has to load alongside Inter, which carries no CJK glyphs.
      Without it every Chinese string falls back to the generic family (新細明體
      on Windows), whose strokes blur together below 14px. Google Fonts splits
      the face by unicode-range, so only the subsets actually used are fetched.
    -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Noto+Sans+TC:wght@400;600&display=swap"
    />
    <meta name="theme-color" content="#f3f2f2" />
    <link rel="manifest" href="/manifest.json" />
    <!--
      The icons are the one brand asset served as a plain static file rather
      than through /v1: the tab icon is drawn before the app loads, so routing
      it through the server would tie it to the backend and the proxy, and
      browsers cache favicons for a very long time. favicon.svg carries the
      BSL 1.1 licence notice.

      favicon.ico is that same file rasterized, for consumers that cannot read
      SVG. Icon fetchers request /favicon.ico and nothing else; with no such
      file the SPA fallback answers with index.html and they drop to the parent
      domain, which is why the connector icon for one.laysi.io was the laysi.io
      mark. Browsers that understand SVG still take the first line.
    -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="48x48 32x32 16x16" />
    <title>Laysi One</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
