[workspace]
resolver = "2"
members = [
    "crates/laysi-domain",
    "crates/laysi-license-token",
    "crates/laysi-regulation",
    "crates/laysi-store",
    "crates/laysi-ops",
    "crates/laysi-server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license-file = "../LICENSE.txt"
rust-version = "1.85"

[workspace.dependencies]
laysi-domain = { path = "crates/laysi-domain" }
laysi-license-token = { path = "crates/laysi-license-token" }
laysi-regulation = { path = "crates/laysi-regulation" }
laysi-ops = { path = "crates/laysi-ops" }
laysi-store = { path = "crates/laysi-store" }

# RustFS is S3 compatible, so the official S3 SDK can point at it and there is
# no need to sign SigV4 by hand. Default features are off to avoid the aws-lc-rs
# that `default-https-client` pulls in: it needs cmake to build, and the build
# image (rust:1-slim-trixie) has none. The ring-based rustls is pure Rust and
# builds anywhere.
aws-sdk-s3 = { version = "1", default-features = false, features = [
    "rt-tokio",
    "behavior-version-latest",
] }
aws-smithy-http-client = { version = "1", features = ["rustls-ring"] }
aws-smithy-types = "1"

anyhow = "1"
argon2 = "0.5"
async-trait = "0.1"
# File content travels as base64 in JSON: uploads go through the operation
# registry so that they are MCP tools as well.
base64 = "0.23"
# `multipart` for the upload link, the one route that takes a file as a file.
axum = { version = "0.8", features = ["multipart"] }
blake3 = "1"
chrono = { version = "0.4", features = ["serde"] }
# Already in the tree through openidconnect, so verifying a licence token
# costs no new crate. The signing half lives only on the licence server.
ed25519-dalek = "2"
hex = "0.4"
openidconnect = "4.0.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
# OS entropy only: session tokens and temporary passwords.
# `rand` was three calls to fill a byte buffer, which is this crate underneath.
getrandom = "0.4"
rust_decimal = { version = "1", features = ["serde-with-str", "db-postgres"] }
rust_decimal_macros = "1"
schemars = { version = "1", features = ["chrono04", "uuid1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Deserialisation errors have to name the field that is wrong; serde alone
# reports the type mismatch without the path to it.
serde_path_to_error = "0.1"
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls-ring",
    "postgres",
    "macros",
    "migrate",
    "chrono",
    "uuid",
    "rust_decimal",
    "json",
] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync"] }
toml = "1"
tower-http = { version = "0.7", features = ["trace", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
