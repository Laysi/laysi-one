[package]
name = "laysi-ops"
version.workspace = true
edition.workspace = true
license-file.workspace = true
rust-version.workspace = true
description = "Laysi One 操作註冊表：單一定義同時產生 REST、MCP 與 TypeScript 介面"

[dependencies]
laysi-domain.workspace = true
laysi-license-token.workspace = true
laysi-regulation.workspace = true
laysi-store.workspace = true

anyhow.workspace = true
async-trait.workspace = true
# Document content travels as JSON, hence base64; see the ops/documents.rs
# module docs.
base64.workspace = true
chrono.workspace = true
ed25519-dalek.workspace = true
hex.workspace = true
# The work calendar is fetched from the government open-data platform; see
# the ops/calendar.rs module docs.
reqwest.workspace = true
rust_decimal.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_path_to_error.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
# Two processes checking in against a stand-in licence server, on a database
# of their own; see the tests in src/ops/license.rs.
axum.workspace = true
sqlx.workspace = true
tokio = { workspace = true, features = ["net", "time"] }
