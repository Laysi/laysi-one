# Laysi One: self-hosted deployment
#
#   docker compose up -d --build
#   docker compose logs secrets      # the initialisation code, printed once
#   open http://localhost:8088
#
# No .env is needed and nothing here asks for a value. Compose interpolates
# before any container runs, so a secret it interpolates can only come from a
# file somebody wrote; the `secrets` service below writes them into a volume
# instead, and every consumer reads the file. postgres has POSTGRES_PASSWORD_FILE
# of its own, and the server binaries take any setting as `NAME_FILE`.

services:
  # Generates what must differ between installations, once, into a volume.
  #
  # Never regenerates: a new database password against an existing pgdata
  # volume would leave a database nobody can open, which is the same reason
  # a generated .env must not be rewritten.
  secrets:
    image: alpine:3.24
    volumes:
      - secrets:/secrets
      # The initialisation code has to reach a person, and the person is at a
      # browser rather than a terminal. `:Z` relabels for SELinux, and only
      # this one-shot container writes here.
      - ./setup:/out:Z
    command:
      - sh
      - -c
      - |
        set -eu
        umask 022
        gen() { LC_ALL=C tr -dc 'A-Za-z0-9' < /dev/urandom | head -c 48; }
        # Alphanumeric only: the password is interpolated into a connection
        # string, where a punctuation character breaks the string rather than
        # becoming part of the password.
        [ -s /secrets/pg_password ] || gen > /secrets/pg_password
        [ -s /secrets/setup_token ] || gen > /secrets/setup_token
        [ -s /secrets/database_url ] || printf 'postgres://%s:%s@postgres:5432/%s' \
            "$${POSTGRES_USER:-laysi}" "$$(cat /secrets/pg_password)" "$${POSTGRES_DB:-laysi}" \
            > /secrets/database_url
        chmod 0444 /secrets/*
        # Written once, next to docker-compose.yml. Deleting it is final: a
        # rerun leaves it deleted, and the line below is then the only copy.
        # A read-only mount must not take the whole stack down with it.
        if [ ! -e /out/初始化代碼.txt ] && [ ! -e /out/.written ]; then
            {
                printf '初始化代碼：%s\n\n' "$$(cat /secrets/setup_token)"
                printf '建立第一個帳號時輸入。建立後本檔案沒有用途，可以刪除。\n'
            } > /out/初始化代碼.txt && touch /out/.written || \
                echo "無法寫入 setup/，代碼只在下一行。"
        fi
        echo "初始化代碼：$$(cat /secrets/setup_token)"
        echo "也寫在 setup/初始化代碼.txt。建立第一個帳號時輸入。"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-laysi}
      POSTGRES_DB: ${POSTGRES_DB:-laysi}

  postgres:
    image: postgres:18
    restart: unless-stopped
    depends_on:
      secrets:
        condition: service_completed_successfully
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-laysi}
      POSTGRES_PASSWORD_FILE: /secrets/pg_password
      POSTGRES_DB: ${POSTGRES_DB:-laysi}
      # Collation uses ICU rather than an OS locale: the postgres image does not
      # generate zh_TW.utf8, and setting LANG makes initdb fail outright. ICU is
      # built in and needs no locale package.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale-provider=icu --icu-locale=zh-TW --locale=C.UTF-8"
    volumes:
      # 18 moved PGDATA to /var/lib/postgresql/18/docker and declares the volume
      # one level up, so the mount is the parent directory rather than data/.
      - pgdata:/var/lib/postgresql
      - secrets:/secrets:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-laysi} -d ${POSTGRES_DB:-laysi}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # RustFS: an S3-compatible object store written in Rust, holding scanned
  # documents and attachments. 9000 is the S3 API, 9001 the admin console.
  rustfs:
    image: rustfs/rustfs:1.0.1
    restart: unless-stopped
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-laysi}
      # The one credential that cannot come from a file: RustFS reads it from
      # the environment at startup and has no file form, and overriding another
      # image's entrypoint to inject one breaks on its next release. What
      # actually keeps this bucket closed is that neither 9000 nor 9001 is
      # published — anything that can reach them is already inside this
      # network. Set RUSTFS_SECRET_KEY in the environment to override.
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-laysi-object-store}
    volumes:
      - rustfsdata:/data
    healthcheck:
      # The image is busybox based, with curl but no bash. The S3 root returns
      # 403 or 404 without credentials, which still proves the service is alive,
      # so any HTTP status counts as healthy and curl -f must not be used.
      test:
        - CMD-SHELL
        - curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:9000/ | grep -qE '^[2344][0-9][0-9]$$'
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # Everything REST and the frontend need, except /mcp (LAYSI_SERVE=app). That
  # publicly exposed protocol is served by the separate mcp service below, and
  # the reduction in attack surface is that this process has no /mcp route at
  # all rather than a network-layer block. This service publishes no port; only
  # web reaches it through the Caddy reverse proxy.
  api:
    build:
      # The build context is the repository root: the workspace manifest
      # points license-file at ../LICENSE.txt, so it has to be inside it.
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      LAYSI_SERVE: app
      DATABASE_URL_FILE: /secrets/database_url
      BIND_ADDR: 0.0.0.0:8080
      # The document module stores files in RustFS, so api needs the credentials
      # too. Without them /healthz reports rustfs as unconfigured and the
      # document screen is disabled.
      RUSTFS_ENDPOINT: http://rustfs:9000
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-laysi}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-laysi-object-store}
      RUSTFS_BUCKET: ${RUSTFS_BUCKET:-laysi-documents}
      # Session timeouts are settings on 「基礎設定」; the Secure flag on the
      # cookie follows X-Forwarded-Proto.
      # Whether the first account may be created from the browser. Only the api
      # service needs these: mcp mounts no /v1 routes at all.
      SETUP_ALLOW_WEB: ${SETUP_ALLOW_WEB:-true}
      SETUP_TOKEN_FILE: /secrets/setup_token
      RUST_LOG: ${RUST_LOG:-info,sqlx=warn}
    volumes:
      - secrets:/secrets:ro
      # Half of what the licence is bound to, and it has to be mounted into
      # every service that dispatches operations: the two would otherwise
      # compute different fingerprints from the same database and one of them
      # would consider itself unlicensed. Without it the fingerprint is the
      # database identifier alone, and a copy of the volume onto another host
      # would look like the same installation. Adding this mount to a running
      # installation changes the fingerprint once, so the reseller has to
      # unbind the licence before the next check succeeds.
      - /etc/machine-id:/etc/machine-id:ro
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/laysi-server", "--healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Serves only /healthz and /mcp (LAYSI_SERVE=mcp). This process has no REST at
  # all, no session cookie and no login endpoint to attack. It is the only
  # backend service publishing a port: AI connectors (Claude Code, the desktop
  # app) connect to it directly, bypassing the web container. Only the port is
  # exposed; put TLS and a domain behind a reverse proxy of your choice (Caddy,
  # Traefik, nginx). None is bundled.
  #
  # Reuses backend/Dockerfile: the same image and the same postgres, differing
  # only in LAYSI_SERVE and the published port.
  mcp:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      LAYSI_SERVE: mcp
      DATABASE_URL_FILE: /secrets/database_url
      BIND_ADDR: 0.0.0.0:8080
      # The RustFS credentials are given here as well, deliberately.
      # upload_document and get_document are registry operations and therefore
      # MCP tools; withholding the credentials would not remove them, only make
      # them answer "object storage is not connected" when called. That would
      # leave the document module broken for AI rather than disabled, and would
      # make "every operation is available over MCP" untrue. What actually
      # governs whether AI may use these two tools is mcp_tool_grant and the
      # role permission, both of which run in dispatch before object storage is
      # touched. The credentials open no extra hole; they only let an already
      # permitted call work.
      RUSTFS_ENDPOINT: http://rustfs:9000
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-laysi}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-laysi-object-store}
      RUSTFS_BUCKET: ${RUSTFS_BUCKET:-laysi-documents}
      # The per-token call limit is a setting on 「基礎設定」. This one stays
      # here: a comma-separated Origin allow list guarding against DNS
      # rebinding on a port whoever deploys chose to publish, which is the same
      # layer as the port number. Empty accepts only callers that send no
      # Origin, which normal AI connectors do not.
      MCP_ALLOWED_ORIGINS: ${MCP_ALLOWED_ORIGINS:-}
      RUST_LOG: ${RUST_LOG:-info,sqlx=warn}
    volumes:
      - secrets:/secrets:ro
      # Half of what the licence is bound to, and it has to be mounted into
      # every service that dispatches operations: the two would otherwise
      # compute different fingerprints from the same database and one of them
      # would consider itself unlicensed. Without it the fingerprint is the
      # database identifier alone, and a copy of the volume onto another host
      # would look like the same installation. Adding this mount to a running
      # installation changes the fingerprint once, so the reseller has to
      # unbind the licence before the next check succeeds.
      - /etc/machine-id:/etc/machine-id:ro
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/laysi-server", "--healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    ports:
      # The only published backend port. TLS and the domain are left to whoever
      # runs a reverse proxy in front of it.
      - "${MCP_PORT:-8089}:8080"

  # Off-site backup. Where the copy goes is a setting on 「安全與營運」, read
  # out of backup_setting on every pass, so this service takes no destination
  # of its own and needs no restart when the destination changes.
  #
  # It holds the database credentials because it dumps the database, and the
  # object store credentials because it mirrors the bucket. Both copies leave
  # encrypted to a public key whose private half the system does not keep.
  backup:
    build:
      context: ./backup
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL_FILE: /secrets/database_url
      RUSTFS_ENDPOINT: http://rustfs:9000
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-laysi}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-laysi-object-store}
      RUSTFS_BUCKET: ${RUSTFS_BUCKET:-laysi-documents}
      # How often a pass runs. A pass with backups switched off costs one
      # query, so this is not a setting anybody needs on a screen.
      BACKUP_INTERVAL_SECONDS: 86400
    volumes:
      - secrets:/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_healthy

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8088}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  rustfsdata:
  secrets:
