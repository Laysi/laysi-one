# Publish amended rates to the feed `refresh_regulations` reads.
#
# A rate the legislature changed is data, not a schema change, so it must not
# cost an image: an installation fetches it from the feed instead. The rule
# files here stay the source; this only republishes them as one JSON document.
#
# The feed repository is public and holds nothing but manifest.json, which
# installations read straight off raw.githubusercontent.com — no Pages build
# to wait on. REGULATION_FEED_KEY is a deploy key on that repository rather
# than a personal token: it reaches one repository, it does not expire, and it
# does not stop working when whoever created it leaves.

name: regulation-feed

on:
  push:
    branches: [main]
    paths:
      - 'backend/regulation/**'
      - 'scripts/regulation-manifest.ts'
      - '.github/workflows/regulation-feed.yml'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun scripts/regulation-manifest.ts manifest.json

      - name: Push to the feed
        env:
          KEY: ${{ secrets.REGULATION_FEED_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          git clone --depth 1 git@github.com:Laysi/regulation-feed.git feed
          cp manifest.json feed/manifest.json
          cd feed
          git config user.name 'laysi-one'
          git config user.email 'noreply@laysi.io'
          git add manifest.json
          # Nothing to publish is the ordinary outcome: a push that touched
          # the rule files without changing a payload lands here too.
          git diff --cached --quiet && exit 0
          git commit -m "chore: republish regulation manifest from ${GITHUB_SHA::7}"
          git push
