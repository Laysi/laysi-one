# Deploys a published version to one of the two installs on that host.
#
#   gh workflow run deploy.yml -f version=0.1.0
#   gh workflow run deploy.yml -f version=0.1.0 -f target=demo
#
# The host stores no registry credentials: it is handed this run's own
# GITHUB_TOKEN to pull with and logs out again. The runner reaches it through
# the same Cloudflare Tunnel that serves the site, so the deployment publishes
# nothing to the internet of its own.
#
# release.yml builds the images, publishes the release with its signed manifest
# and then, for a final release, calls this with target=demo, so the demo runs
# the newest release without anybody remembering to push it, while one.laysi.io
# stays a deliberate act. A release candidate is not deployed here.
#
# The two installs share the images, docker-compose.prod.yml and this file.
# They differ in a directory, an overlay and what happens to the data: the
# product keeps its books across a deployment and the demo is rebuilt from
# nothing, because a demo whose books survive is a demo somebody has already
# edited.

name: Deploy

on:
  workflow_dispatch:
    inputs:
      version:
        description: Image tag to deploy
        default: latest
      target:
        description: Which install
        type: choice
        options: [production, demo]
        default: production

  workflow_call:
    inputs:
      version:
        type: string
        default: latest
      target:
        type: string
        default: production

permissions:
  contents: read
  packages: read

env:
  DEPLOY_HOST: one-ssh.laysi.io
  DEPLOY_USER: ai-km
  # This host keeps its `podman` and `podman-compose` shims in ~/bin, and an
  # ssh command runs a non-login shell, which does not have it on PATH. The
  # value is literal on purpose: the remote shell expands $HOME, not this one.
  REMOTE_PATH: PATH=$HOME/bin:$PATH

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Name the install
        env:
          TARGET: ${{ inputs.target }}
        run: |
          set -eu
          case "$TARGET" in
              demo)
                  {
                      echo "DEPLOY_DIR=laysi-one-demo"
                      echo "PROJECT=laysi-one-demo"
                      echo "OVERLAY=docker-compose.demo.yml"
                      echo "API_CONTAINER=laysi-demo-api"
                      echo "SITE=https://demo.laysi.one/"
                  } >> "$GITHUB_ENV"
                  ;;
              production|'')
                  {
                      echo "DEPLOY_DIR=laysi-one"
                      echo "PROJECT=laysi-one"
                      echo "OVERLAY=docker-compose.host.yml"
                      echo "API_CONTAINER=laysi-one-api"
                      echo "SITE=https://one.laysi.io/"
                  } >> "$GITHUB_ENV"
                  ;;
              *)
                  echo "unknown target \"$TARGET\""; exit 1 ;;
          esac

      - name: Install cloudflared
        run: |
          curl -fsSL -o cloudflared \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/

      - name: Configure ssh
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -eu
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Pinned rather than trusted on first use: the tunnel is reachable by
          # anyone, and the host key is what proves this is the right machine.
          printf '%s ssh-ed25519 %s\n' "$DEPLOY_HOST" \
            'AAAAC3NzaC1lZDI1NTE5AAAAIC604ENTjAQN0XSpM17AYa8XZUds/bMxrTTDIs1dIxsP' \
            > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host $DEPLOY_HOST
              User $DEPLOY_USER
              IdentityFile ~/.ssh/id_ed25519
              IdentitiesOnly yes
              ProxyCommand cloudflared access ssh --hostname %h
          EOF

      - name: Send the compose files
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -eu
          # metadata-action publishes `{{version}}`, which drops the tag's `v`,
          # so release.yml can hand this workflow its own ref_name unchanged
          # and a person can type either form. An emptied field means what
          # compose's `${LAYSI_VERSION:-latest}` would make of it, so the tag
          # the readiness check expects is the one compose runs.
          VERSION=${VERSION#v}
          VERSION=${VERSION:-latest}
          echo "LAYSI_VERSION=$VERSION" >> "$GITHUB_ENV"
          ssh "$DEPLOY_HOST" "mkdir -p $DEPLOY_DIR"
          scp docker-compose.prod.yml "$OVERLAY" "$DEPLOY_HOST:$DEPLOY_DIR/"
          # The version is free text from workflow_dispatch and lands inside a
          # single-quoted argument of a command that runs on the production
          # host. A quote or a semicolon in it would close that argument and
          # run as the deployment user; nothing a tag legitimately contains is
          # outside this set.
          case $VERSION in
              *[!A-Za-z0-9._-]*) echo "version may only contain letters, digits, dot, underscore and hyphen"; exit 1 ;;
          esac
          ssh "$DEPLOY_HOST" "cd $DEPLOY_DIR && printf 'LAYSI_VERSION=%s\n' '$VERSION' > .env"

      # The host pulls, rather than the runner pulling and streaming the images
      # down the tunnel. The registry hands each machine the build that matches
      # it, so there is no platform for this workflow to guess -- guessing it
      # wrong loaded images the host could not execute and took the site down.
      #
      # The credential is this run's own GITHUB_TOKEN, presented and then
      # discarded, so the host still stores no registry credentials. `trap`
      # rather than a trailing command: a failed pull must not leave one behind.
      - name: Pull the images on the host
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          set -eu
          printf '%s' "$GHCR_TOKEN" | ssh "$DEPLOY_HOST" \
            "$REMOTE_PATH; set -eu; trap 'podman logout ghcr.io >/dev/null 2>&1' EXIT; \
             podman login ghcr.io -u '$ACTOR' --password-stdin >/dev/null && \
             cd $DEPLOY_DIR && \
             podman-compose -p $PROJECT -f docker-compose.prod.yml -f $OVERLAY \
             pull api mcp web backup"

      # Read before anything is restarted. The container this deployment
      # replaces stays up and healthy until it is torn down, so the readiness
      # check at the end needs its ID to tell it from the one that replaces it.
      - name: Note the api container being replaced
        run: |
          set -eu
          ps=$(ssh "$DEPLOY_HOST" "$REMOTE_PATH; podman ps -a --format '{{.ID}} {{.Names}}'")
          id=$(printf '%s\n' "$ps" | awk -v name="$API_CONTAINER" '$2 == name { print $1 }')
          echo "replacing: ${id:-nothing}"
          echo "REPLACED_ID=$id" >> "$GITHUB_ENV"

      - name: Restart the stack
        if: inputs.target != 'demo'
        run: |
          set -eu
          # Detached: recreating containers reconfigures the podman bridge that
          # cloudflared sits on, which resets this very SSH connection. The step
          # below reconnects to find out how it went.
          ssh "$DEPLOY_HOST" "$REMOTE_PATH; cd $DEPLOY_DIR && \
            setsid nohup podman-compose -p $PROJECT -f docker-compose.prod.yml -f $OVERLAY \
            up -d --force-recreate > deploy.log 2>&1 < /dev/null & sleep 2"

      # The demo is not restarted, it is rebuilt: the script throws the books
      # away, brings the stack up on the new images, activates the licence and
      # seeds again. Doing it here as well as nightly is what makes the seeded
      # data match the build that is serving it.
      - name: Rebuild the demo
        if: inputs.target == 'demo'
        run: |
          set -eu
          ssh "$DEPLOY_HOST" "test -s .config/laysi-demo.env || \
            { echo 'write ~/.config/laysi-demo.env with DEMO_ACTIVATION_KEY first'; exit 1; }"
          ssh "$DEPLOY_HOST" "mkdir -p .config/systemd/user"
          scp deploy/reset-demo.sh "$DEPLOY_HOST:$DEPLOY_DIR/"
          scp deploy/laysi-demo-reset.service deploy/laysi-demo-reset.timer \
            "$DEPLOY_HOST:.config/systemd/user/"
          # A non-login ssh session has neither XDG_RUNTIME_DIR nor, unless the
          # account lingers, a user manager to talk to. The stack itself is
          # rootless podman, so lingering is already how it survives logout.
          ssh "$DEPLOY_HOST" "loginctl enable-linger \$(id -un) 2>/dev/null || true; \
            export XDG_RUNTIME_DIR=/run/user/\$(id -u) && \
            systemctl --user daemon-reload && \
            systemctl --user enable --now laysi-demo-reset.timer"
          # Started detached because recreating containers reconfigures the
          # podman bridge cloudflared sits on, which resets this connection --
          # so the unit is polled rather than the command waited on.
          #
          # `show` rather than `is-active`, which exits non-zero for every
          # state but active, `activating` included. A run the timer already
          # has going is waited out first: a start issued during it merges
          # into it, and it was started before this deployment's .env. The run
          # is this deployment's once it is seen activating after the start,
          # or once the invocation ID has moved on. Unreachable polls are the
          # bridge reset and are retried.
          #
          # The deadline is two TimeoutStartSec and two minutes: the timer's
          # run, then this one, so a hung rebuild ends as a failure systemd
          # reports. The loop gives up on the first poll that ends past it.
          unit="XDG_RUNTIME_DIR=/run/user/\$(id -u) systemctl --user"
          started='' ran='' finished='' before=''
          deadline=$(( $(date +%s) + 2 * 900 + 120 ))
          while :; do
              props=$(ssh -o ConnectTimeout=15 "$DEPLOY_HOST" \
                "$unit show -p ActiveState -p InvocationID -p Result -p ExecMainCode -p ExecMainStatus \
                laysi-demo-reset.service" 2>/dev/null) || props=
              state=$(printf '%s\n' "$props" | sed -n 's/^ActiveState=//p')
              id=$(printf '%s\n' "$props" | sed -n 's/^InvocationID=//p')
              echo "reset unit: ${state:-unknown}"
              case $state in
                  '') ;;
                  activating|deactivating)
                      [ -z "$started" ] || ran=yes ;;
                  *)
                      if [ -n "$ran" ] || { [ -n "$started" ] && [ "$id" != "$before" ]; }; then
                          finished=yes
                          break
                      fi
                      [ -n "$started" ] || before=$id
                      started=yes
                      ssh -o ConnectTimeout=15 "$DEPLOY_HOST" \
                        "$unit start --no-block laysi-demo-reset.service" || true ;;
              esac
              [ "$(date +%s)" -lt "$deadline" ] || break
              sleep 10
          done
          # Inactive is also where a run stopped by hand, or cut short by a host
          # reboot, ends up. Only a main process that exited with 0 (code 1 is
          # CLD_EXITED) got through the seeding. `show` prints properties in
          # its own order, not the order asked for, so lines are matched.
          clean=$(printf '%s\n' "$props" | grep -cxE 'Result=success|ExecMainCode=1|ExecMainStatus=0') || true
          if [ -z "$finished" ] || [ "$state" != inactive ] || [ "$clean" != 3 ]; then
              printf '%s\n' "$props"
              ssh "$DEPLOY_HOST" "tail -n 40 $DEPLOY_DIR/reset.log" || true
              echo "the demo rebuild did not complete"
              exit 1
          fi

      # Ready means healthy, not the container noted before the restart, and
      # on the image tag this run deployed. A check on the name and the health
      # alone is passed by the container being replaced, before anything has
      # changed.
      - name: Wait for the stack, then check the site
        run: |
          set -eu
          for _ in $(seq 90); do
              ps=$(ssh -o ConnectTimeout=15 "$DEPLOY_HOST" \
                "$REMOTE_PATH; podman ps --format '{{.ID}} {{.Names}} {{.Image}} {{.Status}}'" 2>/dev/null) || ps=
              ok=$(printf '%s\n' "$ps" | awk -v name="$API_CONTAINER" -v old="$REPLACED_ID" -v version="$LAYSI_VERSION" '
                  $2 == name && $1 != old && /\(healthy\)$/ { tag = $3; sub(/.*:/, "", tag); if (tag == version) print "yes" }')
              [ "$ok" != yes ] || break
              sleep 5
          done
          # Production's restart leaves deploy.log; the demo's rebuild was
          # checked, and its log printed on failure, by the step before.
          ssh "$DEPLOY_HOST" "$REMOTE_PATH; cd $DEPLOY_DIR && \
            podman ps -a --format '{{.Names}} | {{.Image}} | {{.Status}}' | grep laysi; \
            tail -5 deploy.log 2>/dev/null" || true
          [ "$ok" = yes ] || { echo "$API_CONTAINER never came up healthy on $LAYSI_VERSION"; exit 1; }
          # Retried, because a healthy api is not yet a served page: `web`
          # starts only once api reports healthy, and the tunnel needs a moment
          # to find the container it was just recreated as. One shot here reads
          # that gap as a failed deployment and returns 502.
          for _ in $(seq 24); do
              code=$(curl -s -o /dev/null -w '%{http_code}' "$SITE")
              echo "$SITE -> $code"
              [ "$code" = 200 ] && exit 0
              sleep 5
          done
          exit 1
