# Puts a published licence server image on its host, on demand.
#
#   gh workflow run license-deploy.yml -f version=license-v0.1.0
#
# license-release.yml builds the image on a `license-v*` tag; this only moves
# one of them onto the host, which is the same split the product uses. Naming
# a tag rather than building from main is what makes a rollback one more run
# of this workflow.
#
# The host pulls the image itself, with this run's own GITHUB_TOKEN, and logs
# out again: it stores no registry credentials, and no image crosses the
# tunnel. Same arrangement deploy.yml uses on the same machine.
#
# The signing key never enters the image. It is written into the host's volume
# from a secret here, because an image gets copied, cached and pulled, and this
# key cannot be rotated without a release reaching every installation in the
# field first.
#
# Set the repository variable LICENSE_DEPLOY_HOST before the first run.

name: Deploy licence server

on:
  workflow_dispatch:
    inputs:
      version:
        description: Image tag to deploy
        default: latest

  # license-release.yml calls this on a license-v* tag, so cutting the tag
  # deploys it. The version is named rather than latest: this host has to be
  # able to say which build it runs, and a rollback is one more run of this
  # workflow with an earlier tag.
  workflow_call:
    inputs:
      version:
        type: string
        default: latest
    # Declared one by one so a caller passes exactly these and nothing else.
    # SMTP_URL may be empty: that turns mail off rather than failing the
    # deploy, as the step that writes it explains.
    secrets:
      DEPLOY_SSH_KEY:
        required: true
      LICENSE_SIGNING_KEY:
        required: true
      SMTP_URL:
        required: false

permissions:
  contents: read
  packages: read

env:
  DEPLOY_HOST: ${{ vars.LICENSE_DEPLOY_HOST }}
  DEPLOY_USER: ai-km
  DEPLOY_DIR: laysi-one-license
  # This host keeps its `podman` and `podman-compose` shims in ~/bin, and an
  # ssh command runs a non-login shell, which does not have it on PATH. The
  # value is literal on purpose: the remote shell expands $HOME, not this one.
  REMOTE_PATH: PATH=$HOME/bin:$PATH
  # Pinned by `name:` in license-server/docker-compose.yml, which is what
  # prefixes every volume. Changing one without the other starts the stack
  # from an empty secrets volume and generates a second signing key.
  SECRETS_VOLUME: laysi-one-license_secrets

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install cloudflared
        run: |
          curl -fsSL -o cloudflared \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/

      - name: Configure ssh
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -eu
          test -n "$DEPLOY_HOST" || { echo "set the LICENSE_DEPLOY_HOST variable"; exit 1; }
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Pinned rather than trusted on first use, the same as deploy.yml:
          # the tunnel is reachable by anyone, and the host key is what proves
          # this is the right machine. Written out here rather than kept in a
          # secret: a host public key is not one, and a copy nobody can read is
          # a copy nobody notices has gone stale.
          printf '%s ssh-ed25519 %s\n' "$DEPLOY_HOST" \
            'AAAAC3NzaC1lZDI1NTE5AAAAIC604ENTjAQN0XSpM17AYa8XZUds/bMxrTTDIs1dIxsP' \
            > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host $DEPLOY_HOST
              User $DEPLOY_USER
              IdentityFile ~/.ssh/id_ed25519
              IdentitiesOnly yes
              ProxyCommand cloudflared access ssh --hostname %h
          EOF

      - name: Send the compose files
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -eu
          ssh "$DEPLOY_HOST" "mkdir -p $DEPLOY_DIR"
          scp license-server/docker-compose.prod.yml license-server/docker-compose.host.yml \
            "$DEPLOY_HOST:$DEPLOY_DIR/"
          # Before the pull, not after: the compose file is where the image
          # address lives, and LICENSE_VERSION is the half of it this run
          # decides. The tag carries its own `license-v` prefix, so unlike the
          # product's version there is nothing to strip.
          # The version is free text from workflow_dispatch and lands inside a
          # single-quoted argument of a command that runs on the production
          # host. A quote or a semicolon in it would close that argument and
          # run as the deployment user; nothing a tag legitimately contains is
          # outside this set.
          case $VERSION in
              *[!A-Za-z0-9._-]*) echo "version may only contain letters, digits, dot, underscore and hyphen"; exit 1 ;;
          esac
          ssh "$DEPLOY_HOST" "cd $DEPLOY_DIR && printf 'LICENSE_VERSION=%s\n' '$VERSION' > .env"

      # The host pulls, rather than the runner pulling and streaming the image
      # down the tunnel. The registry hands each machine the build that matches
      # it, so there is no platform for this workflow to guess -- guessing it
      # wrong loaded images the product's host could not execute and took that
      # site down for 25 minutes, which is why deploy.yml stopped guessing
      # first.
      #
      # The credential is this run's own GITHUB_TOKEN, scoped by the
      # `permissions` block above and dead when the job ends, presented and
      # then discarded. `trap` rather than a trailing command: a failed pull
      # must not leave one behind.
      - name: Pull the image on the host
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          set -eu
          printf '%s' "$GHCR_TOKEN" | ssh "$DEPLOY_HOST" \
            "$REMOTE_PATH; set -eu; trap 'podman logout ghcr.io >/dev/null 2>&1' EXIT; \
             podman login ghcr.io -u '$ACTOR' --password-stdin >/dev/null && \
             cd $DEPLOY_DIR && \
             podman-compose -f docker-compose.prod.yml -f docker-compose.host.yml pull app"

      - name: Provision the signing key
        env:
          LICENSE_SIGNING_KEY: ${{ secrets.LICENSE_SIGNING_KEY }}
        run: |
          set -eu
          test -n "$LICENSE_SIGNING_KEY" || { echo "set the LICENSE_SIGNING_KEY secret"; exit 1; }
          # Only when the volume has none. Overwriting a key that is already
          # signing licences would invalidate every token in the field, and a
          # deployment is not where that decision belongs.
          printf '%s' "$LICENSE_SIGNING_KEY" | ssh "$DEPLOY_HOST" \
            "$REMOTE_PATH; podman volume create ${SECRETS_VOLUME} >/dev/null 2>&1 || true; \
             podman run --rm -i -v ${SECRETS_VOLUME}:/secrets alpine:3.24 sh -c \
             '[ -s /secrets/license_signing_key ] || { cat > /secrets/license_signing_key; \
              chmod 0444 /secrets/license_signing_key; }'"

      - name: Provision the SMTP credential
        env:
          SMTP_URL: ${{ secrets.SMTP_URL }}
        run: |
          set -eu
          # Rewritten every deploy, unlike the signing key: rotating an SES
          # SMTP credential is routine, and nothing in the field depends on
          # this one staying the same. An unset secret writes an empty file,
          # which turns mail off rather than failing the deploy -- the console
          # then shows the password on screen, as it did before mail existed.
          printf '%s' "$SMTP_URL" | ssh "$DEPLOY_HOST" \
            "$REMOTE_PATH; podman run --rm -i -v ${SECRETS_VOLUME}:/secrets alpine:3.24 sh -c \
             'cat > /secrets/smtp_url; chmod 0444 /secrets/smtp_url'"

      - name: Install the nightly backup
        run: |
          set -eu
          ssh "$DEPLOY_HOST" "mkdir -p .config/systemd/user"
          scp license-server/deploy/backup.sh "$DEPLOY_HOST:$DEPLOY_DIR/"
          scp license-server/deploy/laysi-license-backup.service \
              license-server/deploy/laysi-license-backup.timer \
            "$DEPLOY_HOST:.config/systemd/user/"
          # A non-login ssh session has neither XDG_RUNTIME_DIR nor, unless the
          # account lingers, a user manager to talk to. The stack itself is
          # rootless podman, so lingering is already how it survives logout.
          ssh "$DEPLOY_HOST" "loginctl enable-linger \$(id -un) 2>/dev/null || true; \
            export XDG_RUNTIME_DIR=/run/user/\$(id -u) && \
            systemctl --user daemon-reload && \
            systemctl --user enable --now laysi-license-backup.timer"
          # The credentials are set up once, by hand, and are not a deployment
          # input: three of the four are secrets that belong to the bucket
          # rather than to this repository. Their absence is reported here
          # instead of failing the deploy, because a licence server that is
          # running and not yet backed up is still better than one that is not
          # running. The timer is enabled either way, so writing the file is
          # all that remains.
          if ssh "$DEPLOY_HOST" "test -s .config/laysi-license-backup.env"; then
              ssh "$DEPLOY_HOST" "XDG_RUNTIME_DIR=/run/user/\$(id -u) \
                systemctl --user start laysi-license-backup.service" || true
              # `systemctl status`, not `journalctl`: this account is not in
              # systemd-journal, so a user journal read comes back empty while
              # the unit's own status still carries its last lines.
              ssh "$DEPLOY_HOST" "XDG_RUNTIME_DIR=/run/user/\$(id -u) \
                systemctl --user status laysi-license-backup.service --no-pager -l" || true
          else
              echo "no ~/.config/laysi-license-backup.env on the host; backups will not run."
              echo "see license-server/deploy/README.md"
          fi

      - name: Restart the stack
        run: |
          set -eu
          ssh "$DEPLOY_HOST" "$REMOTE_PATH; cd $DEPLOY_DIR && \
            podman-compose -f docker-compose.prod.yml -f docker-compose.host.yml up -d secrets && \
            setsid nohup podman-compose -f docker-compose.prod.yml -f docker-compose.host.yml up -d --force-recreate \
            > deploy.log 2>&1 < /dev/null & sleep 2"

      - name: The running key must be the one the product verifies against
        run: |
          set -eu
          for _ in $(seq 60); do
              if ssh -o ConnectTimeout=15 "$DEPLOY_HOST" \
                  "$REMOTE_PATH; podman ps --format '{{.Names}} {{.Status}}' | grep -q 'laysi-license Up'"; then
                  ok=yes
                  break
              fi
              sleep 5
          done
          [ "${ok:-}" = yes ] || { ssh "$DEPLOY_HOST" "tail -20 $DEPLOY_DIR/deploy.log"; exit 1; }
          # The product carries this key as a constant and asks nobody at run
          # time, so a server signing with a different one produces tokens
          # every installation rejects -- and the only symptom is a sentence on
          # the customer's screen. Compared here, where it is one line.
          want=$(sed -n 's/^const PUBLIC_KEY_HEX: &str = "\([0-9a-f]\{64\}\)";$/\1/p' \
            backend/crates/laysi-ops/src/ops/license.rs)
          test -n "$want" || { echo "PUBLIC_KEY_HEX not found; did the constant change shape?"; exit 1; }
          got=$(ssh "$DEPLOY_HOST" "$REMOTE_PATH; cd $DEPLOY_DIR && podman-compose -f docker-compose.prod.yml -f docker-compose.host.yml exec -T app laysi-one-license public-key" | tr -d '\r\n')
          echo "product expects $want"
          echo "server signs as $got"
          [ "$want" = "$got" ] || { echo "the signing key does not match PUBLIC_KEY_HEX"; exit 1; }
