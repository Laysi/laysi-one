# Publishes the deployment images on a version tag.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# Three images go to ghcr.io — api (the server binary, run twice as api and
# mcp), web (Caddy plus the built bundle) and backup — each tagged with the
# version and with `latest`, and each published for linux/amd64 and
# linux/arm64 under one manifest, so `docker compose pull` picks the right one
# on an Apple silicon Mac or an ARM server without being told.
#
# docker-compose.prod.yml is attached to the release with LAYSI_VERSION pinned
# to that tag, so downloading it and running
# `docker compose -f docker-compose.prod.yml up -d` deploys exactly this build.
#
# CI (ci.yml) still guards the code; this workflow only packages a tag that
# already passed it.
#
# Two deployables share this repository and each cuts its own tags: `v*` is
# the product and belongs here, `license-v*` is the licence server and belongs
# to license-release.yml. The prefixes do not overlap, so a tag runs one of
# these workflows and never both.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # The build context is the repository root: the workspace manifest
          # points license-file at ../LICENSE.txt.
          - name: api
            context: .
            file: backend/Dockerfile
            # Compiled into the binary and reported by /v1/meta, so 「安全與
            # 營運」 names the build it is actually running. The other two
            # images have nothing to stamp.
            build-args: LAYSI_BUILD=${{ github.ref_name }}
          - name: web
            context: ./web
            file: ./web/Dockerfile
          - name: backup
            context: ./backup
            file: ./backup/Dockerfile

    steps:
      - uses: actions/checkout@v7

      # Only the runtime stages are emulated. backend/Dockerfile and
      # web/Dockerfile build on the runner's own architecture and cross-compile;
      # backup is an apk install with nothing to compile.
      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Lowercases the owner (ghcr.io rejects uppercase) and emits the
      # org.opencontainers.image.* labels that link the package back here.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          build-args: ${{ matrix.build-args }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Per image, or the three would evict each other from one scope.
          # backend/Dockerfile keeps cargo's target directory on a cache mount,
          # which no registry cache carries, so the api build compiles from
          # scratch every time; the cache saves the base layers only.
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  release:
    needs: images
    runs-on: ubuntu-latest

    steps:
      # Whole history: the notes below are the commits since the previous tag,
      # and a shallow clone has neither the tag nor the commits.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The attached copy pins LAYSI_VERSION to this tag. The copy in the
      # repository keeps `latest`, which is what a git clone should follow.
      - name: Pin the compose file to this tag
        run: sed -i "s/\${LAYSI_VERSION:-latest}/\${LAYSI_VERSION:-${GITHUB_REF_NAME#v}}/g" docker-compose.prod.yml

      # Written here rather than by --generate-notes, which lists merged pull
      # requests and finds none: this repository commits to main. The page a
      # customer lands on has to answer how to install and how to upgrade,
      # because the compose file attached to it is the whole distribution.
      # Shared with the other repositories in the organization, and so are the
      # three settings it reads: one endpoint, one model and one key on the
      # organization rather than a copy in each repository. The endpoint is a
      # URL, so any service speaking the OpenAI format is reachable by changing
      # a variable.
      #
      # `license-v*` tags and the license-server/ tree are the other deployable
      # in this repository, and a customer reading this page runs neither.
      #
      # None of it is required: when the call fails the action hands back the
      # commit list, which is what this page said before there was a model, and
      # it never fails the job -- the compose file attached below is the whole
      # distribution.
      - id: changes
        uses: Laysi/release-notes-action@v1
        with:
          tag: ${{ github.ref_name }}
          tag-pattern: v*
          exclude-paths: license-server
          context: Laysi One 是台灣中小企業的財務與人事系統，讀者是安裝與維運這套系統的人。
          base-url: ${{ vars.AI_BASE_URL }}
          model: ${{ vars.AI_MODEL }}
          api-key: ${{ secrets.AI_API_KEY }}

      - name: Write the notes
        env:
          CHANGES_FILE: ${{ steps.changes.outputs.file }}
        run: sh .github/release-notes.sh "$GITHUB_REF_NAME" > notes.md

      # `gh` is preinstalled on the runner. Editing rather than failing when
      # the release already exists, which is the case for a tag cut in the
      # web UI or a workflow re-run.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" docker-compose.prod.yml --notes-file notes.md \
            || { gh release edit "$GITHUB_REF_NAME" --notes-file notes.md &&
                 gh release upload "$GITHUB_REF_NAME" docker-compose.prod.yml --clobber; }

  # The demo tracks the newest release; one.laysi.io does not. A customer's
  # install is upgraded when its owner decides, and the demo has no owner and
  # nothing to lose -- it is rebuilt from nothing every night anyway, so a
  # release that reaches it late is a release nobody is evaluating.
  demo:
    needs: images
    uses: ./.github/workflows/deploy.yml
    with:
      version: ${{ github.ref_name }}
      target: demo
    secrets: inherit
