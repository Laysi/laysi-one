# Publishes the deployment images on a version tag.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# Three images go to ghcr.io — api (the server binary, run twice as api and
# mcp), web (Caddy plus the built bundle) and backup — each tagged with the
# version and, for a final release, with `latest`, and each published for
# linux/amd64 and linux/arm64 under one manifest, so `docker compose pull`
# picks the right one on an Apple silicon Mac or an ARM server without being
# told.
#
# docker-compose.prod.yml is attached to the release with LAYSI_VERSION pinned
# to that tag, so downloading it and running
# `docker compose -f docker-compose.prod.yml up -d` deploys exactly this build.
#
# release-manifest.txt is attached beside it: the index digest of each of the
# three images, signed with RELEASE_MANIFEST_SIGNING_KEY. A tag on ghcr.io can
# be moved; a digest cannot, and the host-side updater installs only images a
# manifest it verified names. That key is not the licence key and never leaves
# this workflow: the licence server carries manifests and cannot produce one.
# Every `v*` tag is signed; whether a machine is offered it is decided per
# machine on the licence server.
#
# A tag with a `-` in it (v0.2.0-rc.1) is a release candidate: built, signed
# and published like any other, so a machine the licence server points at it
# installs exactly what the final release would ship, but it does not move
# `latest` on ghcr.io, its release is a prerelease -- which keeps it out of
# releases/latest, the URL README.md tells people to install from -- and the
# demo does not run it. scripts/release-workflow-test.ts holds those three.
#
# CI (ci.yml) still guards the code; this workflow only packages a tag that
# already passed it.
#
# Two deployables share this repository and each cuts its own tags: `v*` is
# the product and belongs here, `license-v*` is the licence server and belongs
# to license-release.yml. The prefixes do not overlap, so a tag runs one of
# these workflows and never both.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  # Before any image is built: a key the product does not trust would leave
  # images on ghcr.io with no manifest any installation accepts. The product
  # carries the trusted keys as a constant and asks nobody at run time, so this
  # comparison is the only place a wrong secret shows up before a customer's
  # updater does. Same check license-deploy.yml makes for the licence key.
  signing-key:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      # A version is built once. Rebuilding pushes images with new digests
      # under the same tags, and installations that took the first manifest
      # count themselves up to date on a build nobody else runs. Re-running
      # only the failed jobs does not come back here; a change ships as a new
      # tag.
      - name: This version has no signed manifest yet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          sh .github/published-manifest.sh "$GITHUB_REF_NAME" published.txt
          if [ -e published.txt ]; then
              echo "$GITHUB_REF_NAME already has a signed release manifest; tag the change as a new version"
              exit 1
          fi

      # Pinned to a commit, like the notes action below: this job is handed
      # the signing key, and a tag moves.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0

      - name: The signing key is one the product trusts
        env:
          RELEASE_MANIFEST_SIGNING_KEY: ${{ secrets.RELEASE_MANIFEST_SIGNING_KEY }}
        run: |
          set -eu
          # Every quoted key from the declaration to its closing `];`, which
          # rustfmt puts on one line or several depending on how many keys
          # there are. A renamed constant finds nothing and fails here.
          trusted=$(awk '/^pub const TRUSTED_KEYS: &\[&str\] =/ { on = 1 } on { print } on && /\];$/ { exit }' \
            backend/crates/laysi-license-token/src/release.rs | grep -o '"[0-9a-f]\{64\}"' | tr -d '"' || true)
          test -n "$trusted" || { echo "TRUSTED_KEYS not found; did the constant change shape?"; exit 1; }
          derived=$(bun scripts/release-manifest.ts public-key)
          echo "product trusts:"
          printf '  %s\n' $trusted
          echo "secret signs as:"
          printf '  %s\n' $derived
          for key in $derived; do
              printf '%s\n' "$trusted" | grep -qx "$key" \
                  || { echo "$key is not in TRUSTED_KEYS"; exit 1; }
          done

  images:
    needs: signing-key
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # The build context is the repository root: the workspace manifest
          # points license-file at ../LICENSE.txt.
          - name: api
            context: .
            file: backend/Dockerfile
            # Compiled into the binary and reported by /v1/meta, so 「安全與
            # 營運」 names the build it is actually running. The other two
            # images have nothing to stamp.
            build-args: LAYSI_BUILD=${{ github.ref_name }}
          - name: web
            context: ./web
            file: ./web/Dockerfile
          - name: backup
            context: ./backup
            file: ./backup/Dockerfile

    steps:
      - uses: actions/checkout@v7

      # Only the runtime stages are emulated. backend/Dockerfile and
      # web/Dockerfile build on the runner's own architecture and cross-compile;
      # backup is an apk install with nothing to compile.
      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Lowercases the owner (ghcr.io rejects uppercase) and emits the
      # org.opencontainers.image.* labels that link the package back here.
      #
      # `latest` is what the repository's docker-compose.prod.yml pulls, so a
      # release candidate must not take it. The action would add it on its own
      # for a final semver tag; that is switched off so the one line below is
      # the whole rule.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.name }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          build-args: ${{ matrix.build-args }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Per image, or the three would evict each other from one scope.
          # backend/Dockerfile keeps cargo's target directory on a cache mount,
          # which no registry cache carries, so the api build compiles from
          # scratch every time; the cache saves the base layers only.
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      # The index digest of what this run pushed, for the manifest job. Matrix
      # jobs overwrite each other's outputs, so each image leaves its own
      # artifact; overwrite covers a re-run of all jobs, which pushes and
      # records again.
      - name: Record the index digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ matrix.name }}
        run: printf '%s\n' "$DIGEST" > "digest-$IMAGE"

      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.name }}
          path: digest-${{ matrix.name }}
          overwrite: true

  # Its own job, so the signing key is on a runner that runs nothing else:
  # the release job below hands AI_API_KEY to a third-party action.
  manifest:
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0

      - uses: actions/download-artifact@v8
        with:
          pattern: digest-*
          merge-multiple: true
          path: digests

      - name: Sign the release manifest
        env:
          RELEASE_MANIFEST_SIGNING_KEY: ${{ secrets.RELEASE_MANIFEST_SIGNING_KEY }}
        run: |
          set -eu
          bun scripts/release-manifest.ts sign --version "$GITHUB_REF_NAME" \
            --api "$(cat digests/digest-api)" \
            --web "$(cat digests/digest-web)" \
            --backup "$(cat digests/digest-backup)" \
            --out release-manifest.txt
          cat release-manifest.txt

      - uses: actions/upload-artifact@v7
        with:
          name: release-manifest
          path: release-manifest.txt
          overwrite: true

  release:
    needs: [images, manifest]
    runs-on: ubuntu-latest

    steps:
      # Whole history: the notes below are the commits since the previous tag,
      # and a shallow clone has neither the tag nor the commits.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: release-manifest

      - uses: dtolnay/rust-toolchain@1.98.0

      # With the verifier the updater and the product use, against the keys
      # this tag compiles in, before anything is published: a manifest that
      # does not pass here would pass nowhere.
      - name: The manifest verifies as an installation would
        working-directory: backend
        run: |
          cargo run -q -p laysi-license-token --example verify-release-manifest -- \
            ../release-manifest.txt --version "$GITHUB_REF_NAME"

      # The attached copy pins LAYSI_VERSION to this tag. The copy in the
      # repository keeps `latest`, which is what a git clone should follow.
      - name: Pin the compose file to this tag
        run: sed -i "s/\${LAYSI_VERSION:-latest}/\${LAYSI_VERSION:-${GITHUB_REF_NAME#v}}/g" docker-compose.prod.yml

      # A final release counts from the final release before it, a release
      # candidate from whatever tag came before it. The commit list in
      # release-notes.sh asks the same script, so both halves of the page
      # cover one range.
      - id: previous
        name: The tag these notes count from
        run: |
          set -eu
          previous=$(sh .github/previous-tag.sh "$GITHUB_REF_NAME")
          echo "tag=$previous" >> "$GITHUB_OUTPUT"

      # Written here rather than by --generate-notes, which lists merged pull
      # requests and finds none: this repository commits to main. The page a
      # customer lands on has to answer how to install and how to upgrade,
      # because the compose file attached to it is the whole distribution.
      # Shared with the other repositories in the organization, and so are the
      # three settings it reads: one endpoint, one model and one key on the
      # organization rather than a copy in each repository. The endpoint is a
      # URL, so any service speaking the OpenAI format is reachable by changing
      # a variable.
      #
      # `license-v*` tags and the license-server/ tree are the other deployable
      # in this repository, and a customer reading this page runs neither.
      #
      # None of it is required: when the call fails the action hands back the
      # commit list, which is what this page said before there was a model, and
      # it never fails the job -- the compose file attached below is the whole
      # distribution.
      #
      # Pinned to a commit rather than to @v1: this step is handed AI_API_KEY,
      # and a tag moves. Changing version is an edit here, not a push in
      # another repository.
      #
      # Take the sha a tag over there points at. The previous pin was a commit
      # that later releases rewrote away, and its action.yml held an unquoted
      # `Name: value` inside a description, which is not a mapping -- the
      # runner read the manifest as empty and reported `Unexpected type ''
      # encountered while reading 'action manifest root'`. A tagged commit is
      # one the other repository has run its own workflows against.
      #
      # continue-on-error covers what the action cannot cover itself: a
      # manifest that fails to load fails the step, and without this the tag
      # ends up with images on ghcr and no page to download them from. The
      # next step then falls back to the commit list.
      #
      # previous-tag is handed in rather than found by the action: plain
      # version order puts v0.2.0-rc.2 after v0.2.0, so v0.2.1 would count
      # from that release candidate.
      - id: changes
        continue-on-error: true
        uses: Laysi/release-notes-action@ad6ed96c1975be6724225d3c18132e08ad474070  # v1.3.0
        with:
          tag: ${{ github.ref_name }}
          previous-tag: ${{ steps.previous.outputs.tag }}
          tag-pattern: v*
          exclude-paths: license-server
          context: Laysi One 是台灣中小企業的財務與人事系統，讀者是安裝與維運這套系統的人。
          base-url: ${{ vars.AI_BASE_URL }}
          model: ${{ vars.AI_MODEL }}
          api-key: ${{ secrets.AI_API_KEY }}
          # Authenticates to the gateway itself, which is a separate credential
          # from the provider key above: an authenticated gateway rejects a
          # request without it. Omitted entirely when the secret is unset, so a
          # provider called directly is not sent a stray header.
          extra-headers: "${{ secrets.CF_AIG_TOKEN && format('cf-aig-authorization: Bearer {0}', secrets.CF_AIG_TOKEN) || '' }}"

      - name: Write the notes
        env:
          CHANGES_FILE: ${{ steps.changes.outputs.file }}
        run: sh .github/release-notes.sh "$GITHUB_REF_NAME" > notes.md

      # `gh` is preinstalled on the runner. Editing rather than failing when
      # the release already exists, which is the case for a tag cut in the
      # web UI or a workflow re-run.
      #
      # A published manifest is only ever replaced by one with the same body.
      # The same digests sign to the same bytes, so re-running the later jobs
      # replaces the file with itself; other digests under a version that
      # installations already took stop here, whatever path led to them.
      #
      # The prerelease flag is set on both paths, so a release first made by
      # hand ends up flagged the way its tag says. A prerelease is never the
      # repository's latest release, which is what releases/latest serves.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          case $GITHUB_REF_NAME in
          *-*) prerelease=true ;;
          *) prerelease=false ;;
          esac
          sh .github/published-manifest.sh "$GITHUB_REF_NAME" published.txt
          if [ -e published.txt ]; then
              head -n 5 published.txt > published.body
              head -n 5 release-manifest.txt > signed.body
              cmp -s published.body signed.body || {
                  echo "$GITHUB_REF_NAME already published a manifest with other digests; tag the change as a new version"
                  exit 1
              }
          fi
          gh release create "$GITHUB_REF_NAME" docker-compose.prod.yml release-manifest.txt \
              --notes-file notes.md --prerelease="$prerelease" \
            || { gh release edit "$GITHUB_REF_NAME" --notes-file notes.md --prerelease="$prerelease" &&
                 gh release upload "$GITHUB_REF_NAME" docker-compose.prod.yml release-manifest.txt --clobber; }

  # The demo tracks the newest release; one.laysi.io does not. A customer's
  # install is upgraded when its owner decides, and the demo has no owner and
  # nothing to lose -- it is rebuilt from nothing every night anyway, so a
  # release that reaches it late is a release nobody is evaluating.
  #
  # After the release rather than after the images: a tag whose manifest did
  # not sign or verify is not one any installation can take, so the demo does
  # not run it either.
  #
  # Final releases only. A release candidate is checked on a machine of its
  # own, and the demo is what a prospective customer evaluates.
  demo:
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}
    uses: ./.github/workflows/deploy.yml
    with:
      version: ${{ github.ref_name }}
      target: demo
    secrets: inherit
