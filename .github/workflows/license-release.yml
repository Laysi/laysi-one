# Publishes the licence server image on its own version tag.
#
#   git tag license-v0.1.0 && git push origin license-v0.1.0
#
# The tag builds the image and then deploys it: the last job calls
# license-deploy.yml with this tag.
#
# Two deployables share this repository and each cuts its own tags:
# release.yml takes `v*` for the product, this takes `license-v*`. The
# prefixes do not overlap, so a tag runs one of them and never both.
#
# Built for both architectures, like the product images. It runs on one host we
# own and that host is an ARM board today, but an image that only matches the
# machine it happens to sit on cannot be moved to another one without a release
# first -- which is how an amd64-only build ended up unable to follow its host.
#
# The signing key is not here and not in the image. license-deploy.yml writes
# it into the host's volume from a secret; an image gets copied, cached and
# pulled, and this key cannot be rotated without a release reaching every
# installation in the field first.

name: Release licence server

on:
  push:
    tags: ["license-v*"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Only the runtime stage is emulated. license-server/Dockerfile builds on
      # the runner's own architecture and cross-compiles.
      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-license
          # The tag carries the prefix; the image should not. `{{version}}`
          # off a `license-v0.1.0` tag is not semver to the action, so the
          # version is cut from the ref by hand.
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=raw,value=latest

      - uses: docker/build-push-action@v7
        with:
          # The repository root: the token payload is a crate shared with the
          # product, outside license-server/.
          context: .
          file: license-server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=license
          cache-to: type=gha,mode=max,scope=license

  # Cutting the tag deploys it. Nothing else stands between the tag and the
  # host: ci.yml already guards the code, and naming the tag here is what
  # makes a rollback one run of license-deploy.yml with an earlier one.
  deploy:
    needs: image
    uses: ./.github/workflows/license-deploy.yml
    with:
      version: ${{ github.ref_name }}
    secrets: inherit
