# The checks CLAUDE.md asks for, run on every push and pull request.
#
# Not here: function-test.ts, schema-live-test.ts and the MCP scripts. They
# drive a real server against a podman container and are run by hand; what CI
# adds over them is that nothing merges without the cheap checks passing.

name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      # The tests that need a database are #[ignore]d and run in their own
      # step; the rest compile and run without one, because every query is
      # sqlx::query rather than the macro.
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: laysi
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: laysi_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U laysi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - run: cargo fmt --check

      - run: cargo clippy --workspace --all-targets -- -D warnings

      - run: cargo test --workspace

      # The host-side updater depends on laysi-license-token and is linked for
      # musl with rust-lld alone, so nothing that crate pulls in for those
      # targets may compile C.
      - name: laysi-license-token and laysi-updater need no C compiler
        run: |
          for crate in laysi-license-token laysi-updater; do
              for target in x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
                  tree=$(cargo tree -p "$crate" -e normal,build --target "$target" --prefix none)
                  if printf '%s\n' "$tree" | grep -E '^(cc|cmake|ring|blake3) '; then
                      echo "$crate pulls in a C build dependency for $target"
                      exit 1
                  fi
              done
          done

      # The script release.yml signs with, against the Rust verifier, with
      # throwaway keys drawn in the test.
      - uses: oven-sh/setup-bun@v2

      - run: bun ../scripts/release-manifest-test.ts

      - name: cargo test --workspace -- --ignored
        run: cargo test --workspace -- --ignored
        env:
          TEST_DATABASE_URL: postgres://laysi:ci@localhost:5432/laysi_ci

      # Known vulnerabilities in the dependency tree, against the RustSec
      # advisory database. The run itself is the record an audit asks for, so
      # it must not be conditional on anything.
      - uses: taiki-e/install-action@cargo-audit

      - run: cargo audit

      # generated.ts is produced from the registry. A new operation without a
      # regenerated file leaves the frontend unable to name it.
      - name: web/src/api/generated.ts is up to date
        run: |
          cargo run -q -p laysi-server --bin laysi-schema -- /tmp/generated.ts
          diff -u ../web/src/api/generated.ts /tmp/generated.ts

  # The updater runs on the host, whatever its libc, so it ships as a static
  # musl binary for both architectures the api image is built for, linked by
  # rust-lld alone. backend/Dockerfile builds it the same way.
  updater-musl:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: x86_64-unknown-linux-musl, aarch64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Static for both targets
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: rust-lld
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: rust-lld
        run: |
          set -eu
          for target in x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
              cargo build --release --locked -p laysi-updater --bin laysi-updater --target "$target"
              described=$(file "target/$target/release/laysi-updater")
              echo "$described"
              printf '%s\n' "$described" | grep -q 'static' || { echo "not static"; exit 1; }
          done
          ./target/x86_64-unknown-linux-musl/release/laysi-updater version

  # A rollback restores the database into the previous postgres image and
  # leaves RustFS's objects as they are, so a change to either digest must
  # read the same data both ways; a postgres with another ICU must bring the
  # reindex with it. A no-op when neither digest moves.
  third-party-images:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - run: bun scripts/third-party-image-check.ts --base "origin/$GITHUB_BASE_REF"

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "26.8.1"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: oven-sh/setup-bun@v2

      - run: npm ci
        working-directory: web

      # Same reason as cargo audit above. Production dependencies only: a
      # finding in a build tool is worth knowing but is not something the
      # shipped bundle carries, and a wall of those hides the ones that are.
      - run: npm audit --omit=dev --audit-level=high
        working-directory: web

      - run: npm run typecheck
        working-directory: web

      - run: npm run build
        working-directory: web

      # All of them read web/src, so they run after the install above.
      - run: bun scripts/schema-test.ts

      - run: bun scripts/markdown-test.ts

      - run: bun scripts/format-test.ts

      - run: bun scripts/nav-test.ts

      - run: bun scripts/update-test.ts

      # The release page is the whole distribution, so it has to be written
      # even when the model behind the notes is down.
      - run: bun scripts/release-notes-test.ts

      # A rule file the generator cannot read would publish a feed that is
      # missing a rate, and the failure would land on the installation.
      - run: bun scripts/regulation-manifest.ts /dev/null

  # Its own workspace, so its own job: the licence server shares only the
  # token payload with the product and needs neither a database nor a
  # browser toolchain to check.
  license-server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: license-server

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: license-server

      - run: cargo fmt --check

      - run: cargo clippy --all-targets -- -D warnings

      - run: cargo test
